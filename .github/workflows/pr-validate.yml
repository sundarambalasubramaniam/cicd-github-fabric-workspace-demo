name: PR validate

on:
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint notebooks (nbqa + ruff)
        run: |
          # Fabric notebook source lives as .py inside <Item>.Notebook/notebook-content.py
          pip install ruff nbqa
          find workspace -name "notebook-content.py" -print -exec ruff check {} +

      - name: Validate parameter.yml schema
        run: python scripts/validate_parameters.py config/parameter.yml

      - name: Azure login (OIDC)
        if: github.base_ref == 'test' || github.base_ref == 'main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: fabric-cicd dry-run (target Test)
        if: github.base_ref == 'test'
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.WORKSPACE_ID_TEST }}
          FABRIC_ENVIRONMENT: test
          DRY_RUN: "true"
        run: python scripts/deploy.py

      - name: fabric-cicd dry-run (target Prod)
        if: github.base_ref == 'main'
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.WORKSPACE_ID_PROD }}
          FABRIC_ENVIRONMENT: prod
          DRY_RUN: "true"
        run: python scripts/deploy.py
